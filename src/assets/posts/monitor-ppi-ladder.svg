<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #16181d; }
    .t2 { fill: #4a4f58; }
    .t3 { fill: #868c96; }
    .zone { fill: #e4f7f0; }
    .zone-line { stroke: #1baf7a; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.55; }
    .b-good { fill: #1baf7a; }
    .b-ok { fill: #2a78d6; }
    .b-warn { fill: #e08a2e; }
    .b-plain { fill: #9298a1; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #eceef1; }
      .t2 { fill: #b0b5bd; }
      .t3 { fill: #7d838d; }
      .zone { fill: #102b22; }
      .zone-line { stroke: #4fd4a4; }
      .b-good { fill: #4fd4a4; }
      .b-ok { fill: #6aa6ef; }
      .b-warn { fill: #e0a057; }
      .b-plain { fill: #565b64; }
    }
  </style>

  <text x="0" y="26" font-size="18" font-weight="600" class="t1">Pixel density is the number that decides this</text>
  <text x="0" y="48" font-size="12.5" class="t3">ppi of displays you might put next to a Mac. macOS renders sharpest near 218 ppi, where one logical pixel maps to an exact 2 × 2 block.</text>

  <!-- Retina comfort zone 205-235 ppi : x = 195 + ppi*1.635 -->
  <rect x="530" y="70" width="49" height="272" class="zone"/>
  <line x1="530" y1="70" x2="530" y2="342" class="zone-line"/>
  <line x1="579" y1="70" x2="579" y2="342" class="zone-line"/>
  <text x="554" y="64" font-size="11" text-anchor="middle" class="t2">≈218 ppi · Retina density</text>

  <text x="178" y="99" font-size="12.5" text-anchor="end" class="t2">MacBook Pro 14″ (built-in)</text>
  <rect x="195" y="86" width="415" height="18" rx="3" class="b-good"/>
  <text x="618" y="99" font-size="11.5" class="t2">254</text>

  <text x="178" y="131" font-size="12.5" text-anchor="end" class="t2">MacBook Air 13.6″ (built-in)</text>
  <rect x="195" y="118" width="366" height="18" rx="3" class="b-good"/>
  <text x="569" y="131" font-size="11.5" class="t2">224</text>

  <text x="178" y="163" font-size="12.5" font-weight="600" text-anchor="end" class="t1">27″ 5K</text>
  <rect x="195" y="150" width="356" height="18" rx="3" class="b-good"/>
  <text x="559" y="163" font-size="11.5" font-weight="600" class="t1">218</text>

  <text x="178" y="195" font-size="12.5" text-anchor="end" class="t2">32″ 6K</text>
  <rect x="195" y="182" width="353" height="18" rx="3" class="b-good"/>
  <text x="556" y="195" font-size="11.5" class="t2">216</text>

  <text x="178" y="227" font-size="12.5" text-anchor="end" class="t2">24″ 4K</text>
  <rect x="195" y="214" width="301" height="18" rx="3" class="b-ok"/>
  <text x="504" y="227" font-size="11.5" class="t2">184</text>

  <text x="178" y="259" font-size="12.5" font-weight="600" text-anchor="end" class="t1">27″ 4K</text>
  <rect x="195" y="246" width="267" height="18" rx="3" class="b-warn"/>
  <text x="470" y="259" font-size="11.5" font-weight="600" class="t1">163 · non-integer scaling</text>

  <text x="178" y="291" font-size="12.5" text-anchor="end" class="t2">32″ 4K</text>
  <rect x="195" y="278" width="226" height="18" rx="3" class="b-warn"/>
  <text x="429" y="291" font-size="11.5" class="t2">138 · soft at any scaling</text>

  <text x="178" y="323" font-size="12.5" text-anchor="end" class="t2">27″ 1440p</text>
  <rect x="195" y="310" width="178" height="18" rx="3" class="b-plain"/>
  <text x="381" y="323" font-size="11.5" class="t2">109 · clean, but not Retina</text>

  <!-- scale ticks -->
  <line x1="195" y1="348" x2="620" y2="348" stroke="#c6c9c2" stroke-width="1"/>
  <text x="195" y="362" font-size="10.5" text-anchor="middle" class="t3">0</text>
  <text x="358" y="362" font-size="10.5" text-anchor="middle" class="t3">100</text>
  <text x="521" y="362" font-size="10.5" text-anchor="middle" class="t3">200</text>
  <text x="615" y="362" font-size="10.5" text-anchor="middle" class="t3">pp</text>

  <!-- legend -->
  <rect x="0" y="384" width="10" height="10" rx="2" class="b-good"/>
  <text x="17" y="393" font-size="11.5" class="t2">Retina density (exact 2×)</text>
  <rect x="182" y="384" width="10" height="10" rx="2" class="b-ok"/>
  <text x="199" y="393" font-size="11.5" class="t2">Clean at 2×</text>
  <rect x="300" y="384" width="10" height="10" rx="2" class="b-warn"/>
  <text x="317" y="393" font-size="11.5" class="t2">Fractional scaling — text softens</text>
  <rect x="520" y="384" width="10" height="10" rx="2" class="b-plain"/>
  <text x="537" y="393" font-size="11.5" class="t2">Non-Retina, native</text>

  <text x="0" y="418" font-size="11" class="t3">ppi = diagonal in pixels ÷ diagonal in inches. Panel figures are arithmetic from published resolutions; Apple built-in figures are from Apple's spec pages.</text>
</svg>
