<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #16181d; }
    .t2 { fill: #4a4f58; }
    .t3 { fill: #868c96; }
    .divider { stroke: #e2e4e6; stroke-width: 1; }
    .frame-warn { fill: none; stroke: #e08a2e; stroke-width: 1.6; }
    .frame-good { fill: none; stroke: #1baf7a; stroke-width: 1.6; }
    .arrow-warn { stroke: #e08a2e; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .arrow-good { stroke: #1baf7a; stroke-width: 1.6; }
    .g-warn { stroke: #e08a2e; stroke-width: 0.5; opacity: 0.4; }
    .g-good { stroke: #1baf7a; stroke-width: 0.5; opacity: 0.4; }
    .chip-warn { fill: #fdf1e2; }
    .chip-good { fill: #e4f7f0; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #eceef1; }
      .t2 { fill: #b0b5bd; }
      .t3 { fill: #7d838d; }
      .divider { stroke: #2c3036; }
      .frame-warn { stroke: #e0a057; }
      .frame-good { stroke: #4fd4a4; }
      .arrow-warn { stroke: #e0a057; }
      .arrow-good { stroke: #4fd4a4; }
      .g-warn { stroke: #e0a057; }
      .g-good { stroke: #4fd4a4; }
      .chip-warn { fill: #38291a; }
      .chip-good { fill: #102b22; }
    }
  </style>

  <text x="0" y="26" font-size="18" font-weight="600" class="t1">Same apparent workspace, two different pipelines</text>
  <text x="0" y="48" font-size="12.5" class="t3">Both displays are set to “looks like 2560 × 1440”. Only one of them gets there without resampling.</text>

  <line x1="340" y1="66" x2="340" y2="300" class="divider"/>

  <!-- ── LEFT : 27" 4K ───────────────────────────── -->
  <text x="160" y="76" font-size="13" font-weight="600" text-anchor="middle" class="t1">27″ 4K · 163 ppi</text>

  <!-- render canvas -->
  <rect x="95" y="90" width="130" height="73" class="frame-warn"/>
  <g class="g-warn">
    <line x1="111" y1="90" x2="111" y2="163"/><line x1="127" y1="90" x2="127" y2="163"/>
    <line x1="143" y1="90" x2="143" y2="163"/><line x1="159" y1="90" x2="159" y2="163"/>
    <line x1="175" y1="90" x2="175" y2="163"/><line x1="191" y1="90" x2="191" y2="163"/>
    <line x1="207" y1="90" x2="207" y2="163"/>
    <line x1="95" y1="106" x2="225" y2="106"/><line x1="95" y1="122" x2="225" y2="122"/>
    <line x1="95" y1="138" x2="225" y2="138"/><line x1="95" y1="154" x2="225" y2="154"/>
  </g>
  <text x="160" y="131" font-size="11.5" font-weight="600" text-anchor="middle" class="t1">5120 × 2880</text>
  <text x="160" y="146" font-size="10.5" text-anchor="middle" class="t3">what macOS renders</text>

  <!-- arrow -->
  <line x1="160" y1="170" x2="160" y2="212" class="arrow-warn"/>
  <path d="M155 206 L160 214 L165 206" fill="none" stroke="#e08a2e" stroke-width="1.6"/>
  <text x="174" y="188" font-size="11.5" font-weight="600" class="t2">resampled 1.33×</text>
  <text x="174" y="202" font-size="10.5" class="t3">never lands on the grid</text>

  <!-- panel -->
  <rect x="109" y="220" width="102" height="57" class="frame-warn"/>
  <g class="g-warn">
    <line x1="121" y1="220" x2="121" y2="277"/><line x1="133" y1="220" x2="133" y2="277"/>
    <line x1="146" y1="220" x2="146" y2="277"/><line x1="159" y1="220" x2="159" y2="277"/>
    <line x1="172" y1="220" x2="172" y2="277"/><line x1="185" y1="220" x2="185" y2="277"/>
    <line x1="198" y1="220" x2="198" y2="277"/>
    <line x1="109" y1="234" x2="211" y2="234"/><line x1="109" y1="248" x2="211" y2="248"/>
    <line x1="109" y1="262" x2="211" y2="262"/>
  </g>
  <text x="160" y="252" font-size="11" font-weight="600" text-anchor="middle" class="t1">3840 × 2160</text>

  <rect x="18" y="296" width="284" height="30" rx="6" class="chip-warn"/>
  <text x="160" y="316" font-size="11.5" text-anchor="middle" class="t2">Fractional scaling: faint softness in small text</text>

  <!-- ── RIGHT : 27" 5K ──────────────────────────── -->
  <text x="520" y="76" font-size="13" font-weight="600" text-anchor="middle" class="t1">27″ 5K · 218 ppi</text>

  <rect x="455" y="90" width="130" height="73" class="frame-good"/>
  <g class="g-good">
    <line x1="471" y1="90" x2="471" y2="163"/><line x1="487" y1="90" x2="487" y2="163"/>
    <line x1="503" y1="90" x2="503" y2="163"/><line x1="519" y1="90" x2="519" y2="163"/>
    <line x1="535" y1="90" x2="535" y2="163"/><line x1="551" y1="90" x2="551" y2="163"/>
    <line x1="567" y1="90" x2="567" y2="163"/>
    <line x1="455" y1="106" x2="585" y2="106"/><line x1="455" y1="122" x2="585" y2="122"/>
    <line x1="455" y1="138" x2="585" y2="138"/><line x1="455" y1="154" x2="585" y2="154"/>
  </g>
  <text x="520" y="131" font-size="11.5" font-weight="600" text-anchor="middle" class="t1">5120 × 2880</text>
  <text x="520" y="146" font-size="10.5" text-anchor="middle" class="t3">what macOS renders</text>

  <line x1="520" y1="170" x2="520" y2="212" class="arrow-good"/>
  <path d="M515 206 L520 214 L525 206" fill="none" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="534" y="188" font-size="11.5" font-weight="600" class="t2">mapped 1:1</text>
  <text x="534" y="202" font-size="10.5" class="t3">exact 2 × 2 pixels</text>

  <rect x="455" y="220" width="130" height="73" class="frame-good"/>
  <g class="g-good">
    <line x1="471" y1="220" x2="471" y2="293"/><line x1="487" y1="220" x2="487" y2="293"/>
    <line x1="503" y1="220" x2="503" y2="293"/><line x1="519" y1="220" x2="519" y2="293"/>
    <line x1="535" y1="220" x2="535" y2="293"/><line x1="551" y1="220" x2="551" y2="293"/>
    <line x1="567" y1="220" x2="567" y2="293"/>
    <line x1="455" y1="238" x2="585" y2="238"/><line x1="455" y1="256" x2="585" y2="256"/>
    <line x1="455" y1="274" x2="585" y2="274"/>
  </g>
  <text x="520" y="260" font-size="11" font-weight="600" text-anchor="middle" class="t1">5120 × 2880</text>

  <rect x="378" y="296" width="284" height="30" rx="6" class="chip-good"/>
  <text x="520" y="316" font-size="11.5" text-anchor="middle" class="t2">Integer scaling: every logical pixel is 4 physical ones</text>

  <text x="0" y="342" font-size="11" class="t3">“Looks like” values are the macOS Display settings labels. Render-canvas sizes follow the standard explanation of fractional scaling on macOS.</text>
</svg>
