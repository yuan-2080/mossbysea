<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #16181d; }
    .t2 { fill: #4a4f58; }
    .t3 { fill: #868c96; }
    .frame { fill: none; stroke: #c6c9c2; stroke-width: 1.5; }
    .scr-a { fill: #eaf1fb; stroke: #c6c9c2; stroke-width: 1.5; }
    .scr-b { fill: #e4f7f0; stroke: #c6c9c2; stroke-width: 1.5; }
    .body { fill: #e3e4e0; stroke: #c6c9c2; stroke-width: 1.5; }
    .hub { fill: #f4f5f2; stroke: #c6c9c2; stroke-width: 1.5; }
    .wire { fill: none; stroke: #a8adb5; stroke-width: 1.5; }
    .rule { stroke: #e3e4e0; stroke-width: 1; }
    .bad { fill: #b3402f; }
    .ok { fill: #0f7350; }
    .ln { stroke: #8ab6e8; stroke-width: 2; stroke-linecap: round; }
    .ln2 { stroke: #4fd4a4; stroke-width: 2; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #eceef1; }
      .t2 { fill: #b0b5bd; }
      .t3 { fill: #7d838d; }
      .frame { stroke: #3d4046; }
      .scr-a { fill: #1a2433; stroke: #3d4046; }
      .scr-b { fill: #102b22; stroke: #3d4046; }
      .body { fill: #26282c; stroke: #3d4046; }
      .hub { fill: #1b1d21; stroke: #3d4046; }
      .wire { stroke: #565b64; }
      .rule { stroke: #26282c; }
      .bad { fill: #ef8a80; }
      .ok { fill: #4fd4a4; }
      .ln { stroke: #6aa6ef; }
    }
  </style>

  <!-- divider -->
  <line x1="340" y1="36" x2="340" y2="236" class="rule"/>

  <!-- ── Left: MST hub (mirror) ── -->
  <text x="165" y="30" font-size="12.5" text-anchor="middle" class="t3">cheap MST hub, two HDMI outs</text>

  <!-- laptop -->
  <rect x="24" y="132" width="64" height="42" rx="3" class="scr-a"/>
  <rect x="18" y="174" width="76" height="7" rx="3.5" class="body"/>

  <!-- hub -->
  <rect x="130" y="140" width="56" height="26" rx="5" class="hub"/>
  <text x="158" y="156.5" font-size="10" text-anchor="middle" class="t3">MST</text>

  <!-- wires: laptop → hub, hub → two monitors -->
  <path d="M 94 153 L 130 153" class="wire"/>
  <path d="M 186 148 C 210 148 216 76 238 76" class="wire"/>
  <path d="M 186 158 C 210 158 216 200 238 200" class="wire"/>

  <!-- monitor A (same picture) -->
  <rect x="238" y="52" width="76" height="48" rx="4" class="scr-a"/>
  <line x1="276" y1="100" x2="276" y2="110" class="wire"/>
  <line x1="260" y1="110" x2="292" y2="110" class="wire"/>
  <line x1="248" y1="66" x2="304" y2="66" class="ln"/>
  <line x1="248" y1="76" x2="292" y2="76" class="ln"/>

  <!-- monitor B (same picture) -->
  <rect x="238" y="176" width="76" height="48" rx="4" class="scr-a"/>
  <line x1="276" y1="224" x2="276" y2="234" class="wire"/>
  <line x1="260" y1="234" x2="292" y2="234" class="wire"/>
  <line x1="248" y1="190" x2="304" y2="190" class="ln"/>
  <line x1="248" y1="200" x2="292" y2="200" class="ln"/>

  <text x="165" y="258" font-size="13" font-weight="600" text-anchor="middle" class="bad">✗ both monitors show the same picture</text>

  <!-- ── Right: two direct Thunderbolt cables ── -->
  <text x="515" y="30" font-size="12.5" text-anchor="middle" class="t3">two cables, two Thunderbolt 4 ports</text>

  <!-- laptop -->
  <rect x="374" y="132" width="64" height="42" rx="3" class="scr-a"/>
  <rect x="368" y="174" width="76" height="7" rx="3.5" class="body"/>

  <!-- wires: each port → its own monitor -->
  <path d="M 444 146 C 480 146 490 76 560 76" class="wire"/>
  <path d="M 444 160 C 480 160 490 200 560 200" class="wire"/>

  <!-- monitor A -->
  <rect x="560" y="52" width="76" height="48" rx="4" class="scr-a"/>
  <line x1="598" y1="100" x2="598" y2="110" class="wire"/>
  <line x1="582" y1="110" x2="614" y2="110" class="wire"/>
  <line x1="570" y1="66" x2="626" y2="66" class="ln"/>
  <line x1="570" y1="76" x2="614" y2="76" class="ln"/>

  <!-- monitor B (different picture) -->
  <rect x="560" y="176" width="76" height="48" rx="4" class="scr-b"/>
  <line x1="598" y1="224" x2="598" y2="234" class="wire"/>
  <line x1="582" y1="234" x2="614" y2="234" class="wire"/>
  <circle cx="598" cy="200" r="9" fill="none" class="ln2"/>

  <text x="515" y="258" font-size="13" font-weight="600" text-anchor="middle" class="ok">✓ two monitors, two pictures</text>
</svg>
