<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t2 { fill: #4a4f58; }
    .t3 { fill: #868c96; }
    .win { fill: #ffffff; stroke: #c6c9c2; stroke-width: 1; }
    .body { fill: #e3e4e0; stroke: #c6c9c2; stroke-width: 1.5; }
    .stand { stroke: #c6c9c2; stroke-width: 1.5; fill: none; }
    .desk { stroke: #b9bdb6; stroke-width: 2; }
    .divider { stroke: #c6c9c2; stroke-width: 1; opacity: 0.55; }
    .chip { fill: #f4f5f2; }
    /* 大屏壁纸：紫罗兰日落；MacBook：青绿黎明 —— 两屏撞色 */
    .sky-v { fill: #6d28d9; }
    .mtn-v1 { fill: #5b21b6; }
    .mtn-v2 { fill: #4c1d95; }
    .sky-t { fill: #0d9488; }
    .mtn-t { fill: #115e59; }
    .sun-v { fill: #fbbf24; }
    .sun-t { fill: #fde047; }
    .mbar-v { fill: #c4b5fd; }
    .mbar-t { fill: #5eead4; }
    .warn { fill: #b45309; }
    .ok { fill: #047857; }
    @media (prefers-color-scheme: dark) {
      .t2 { fill: #b0b5bd; }
      .t3 { fill: #7d838d; }
      .win { fill: #20242c; stroke: #3d4046; }
      .body { fill: #26282c; stroke: #3d4046; }
      .stand { stroke: #3d4046; }
      .desk { stroke: #3a3e44; }
      .divider { stroke: #3d4046; }
      .chip { fill: #1b1d21; }
      .mbar-v { fill: #5b21b6; }
      .mbar-t { fill: #0f766e; }
      .warn { fill: #f59e0b; }
      .ok { fill: #34d399; }
    }
  </style>

  <defs>
    <clipPath id="mon"><rect x="64" y="40" width="320" height="164" rx="8"/></clipPath>
    <clipPath id="lid"><rect x="458" y="164" width="138" height="62" rx="4"/></clipPath>
  </defs>

  <!-- ── the big external monitor (left) ───────────── -->
  <rect x="64" y="40" width="320" height="164" rx="8" class="sky-v"/>
  <g clip-path="url(#mon)">
    <circle cx="306" cy="82" r="19" class="sun-v"/>
    <polygon points="64,204 158,108 252,204" class="mtn-v1"/>
    <polygon points="196,204 300,88 392,204" class="mtn-v2"/>
  </g>
  <rect x="64" y="40" width="320" height="164" rx="8" fill="none" stroke="#c6c9c2" stroke-width="1.5"/>
  <rect x="74" y="50" width="300" height="10" rx="2" class="mbar-v"/>
  <rect x="88" y="74" width="130" height="80" rx="3" class="win"/>
  <rect x="232" y="88" width="138" height="72" rx="3" class="win"/>
  <rect x="150" y="188" width="148" height="8" rx="4" class="mbar-v"/>
  <line x1="224" y1="204" x2="224" y2="242" class="stand"/>
  <rect x="184" y="242" width="80" height="7" rx="3" class="body"/>

  <!-- ── the cable that carries both ───────────────── -->
  <path d="M452 228 C 420 246, 300 248, 268 246" fill="none" class="divider" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 4"/>

  <!-- ── MacBook Air, open (right)：青绿壁纸撞色 ──── -->
  <rect x="452" y="224" width="150" height="10" rx="5" class="body"/>
  <rect x="458" y="164" width="138" height="62" rx="4" class="sky-t"/>
  <g clip-path="url(#lid)">
    <circle cx="560" cy="182" r="7" class="sun-t"/>
    <polygon points="458,226 514,192 570,226" class="mtn-t"/>
  </g>
  <rect x="458" y="164" width="138" height="62" rx="4" fill="none" stroke="#c6c9c2" stroke-width="1.5"/>
  <rect x="462" y="168" width="130" height="6" rx="2" class="mbar-t"/>
  <rect x="470" y="182" width="70" height="36" rx="3" class="win"/>

  <!-- ── the one desk ──────────────────────────────── -->
  <line x1="24" y1="250" x2="656" y2="250" class="desk"/>

  <!-- ── pixel-density chips ───────────────────────── -->
  <rect x="138" y="264" width="172" height="24" rx="12" class="chip"/>
  <text x="224" y="280" font-size="12.5" text-anchor="middle" class="t2">27″ 4K · <tspan class="warn" font-weight="600">163 ppi</tspan></text>

  <rect x="466" y="264" width="150" height="24" rx="12" class="chip"/>
  <text x="541" y="280" font-size="12.5" text-anchor="middle" class="t2">Air 13″ · <tspan class="ok" font-weight="600">224 ppi</tspan></text>

  <!-- ── kicker ────────────────────────────────────── -->
  <text x="24" y="306" font-size="11.5" class="t2">Same desk, two panels, two pixel densities — the arithmetic behind “looks like Retina” is what this article runs.</text>
</svg>
